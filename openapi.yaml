openapi: 3.0.3
info:
  title: AWS Shop Backend API
  description: Product Service (DynamoDB-backed catalog) and Import Service (CSV upload via S3 signed URLs).
  version: 3.0.0

servers:
  - url: https://mv9r6b0fml.execute-api.us-east-1.amazonaws.com/prod
    description: Product Service
  - url: https://96rbu86vd3.execute-api.us-east-1.amazonaws.com/prod
    description: Import Service

paths:
  /products:
    get:
      summary: Get all products
      description: Returns the full list of products joined with stock counts.
      operationId: getProductsList
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create a new product
      description: Creates a new product and its stock entry transactionally.
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductInput'
            example:
              title: New Gadget
              description: A shiny new gadget
              price: 199
              count: 10
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /import:
    get:
      summary: Get pre-signed URL for CSV upload
      description: Returns a pre-signed S3 URL to upload a CSV file into the `uploaded/` folder. On upload, the `importFileParser` Lambda parses the file and moves it to `parsed/`.
      operationId: importProductsFile
      parameters:
        - name: name
          in: query
          required: true
          description: Name of the CSV file to upload
          schema:
            type: string
      responses:
        '200':
          description: Signed URL (plain string)
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Missing `name` query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /products/{productId}:
    get:
      summary: Get product by ID
      description: Returns a single product joined with its stock count, or 404 if not found.
      operationId: getProductsById
      parameters:
        - name: productId
          in: path
          required: true
          description: Unique product identifier (UUID)
          schema:
            type: string
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Missing productId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  responses:
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Product:
      type: object
      required:
        - id
        - title
        - price
        - count
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        price:
          type: number
        count:
          type: integer
          description: Quantity available in stock
    CreateProductInput:
      type: object
      required:
        - title
        - price
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
        count:
          type: integer
          minimum: 0
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
